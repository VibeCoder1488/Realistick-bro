<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Луг у моря</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9bc3ee;font-family:Georgia,serif}
canvas{display:block}
html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#joy{position:fixed;display:none;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.5)}
#btns{display:none;position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:10px}
#btns button{width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(20,40,20,.45);color:#fff;font-size:15px;touch-action:none}
#btns button.on{background:rgba(120,200,90,.75)}
.touch #btns{display:flex}
#vrBtn{display:none;position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));padding:10px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.6);background:rgba(20,40,20,.55);color:#fff;font:15px Georgia,serif}
#glare,#wash,#uwv{position:fixed;inset:0;pointer-events:none}#uwv{opacity:0;background:radial-gradient(ellipse at center,rgba(20,120,140,.3) 0%,rgba(0,50,80,.75) 100%)}
.ghost{position:fixed;border-radius:50%;pointer-events:none;opacity:0;mix-blend-mode:screen}
#hint{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:#fff;background:rgba(20,40,20,.55);padding:10px 18px;border-radius:20px;font-size:15px;text-align:center;pointer-events:none;transition:opacity 1s;max-width:90vw}
</style></head><body>
<div id="glare"></div><div id="wash" style="background:#fff7e0;opacity:0"></div>
<div id="joy"><div id="knob"></div></div><div id="btns"><button id="bUp">▲</button><button id="bRun">Бег</button><button id="bDn">▼</button></div><button id="vrBtn">Войти в VR</button><div id="hint">Кликните по экрану. WASD — идти, Shift — бежать, мышь или стрелки — смотреть. Впереди море: заходите в воду. Space — всплыть, C — нырнуть. После выхода из воды на камере остаются капли.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.addEventListener('error',e=>{const h=document.getElementById('hint');if(h){h.style.opacity=1;h.textContent='Ошибка: '+e.message;}});
const T=THREE,F=90;
const QUEST=/OculusBrowser|Quest|Oculus/i.test(navigator.userAgent);
const MOB=QUEST||matchMedia('(pointer:coarse)').matches||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const N=MOB?192:384,SH=Math.round(176*N/384),CELL=F/N;
const shoreJS=x=>-10+3.5*Math.sin(x*.09+1)+1.5*Math.sin(x*.23);
const ss=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
const bumpJS=(x,z)=>.55*Math.sin(x*.07+1.3)*Math.sin(z*.06+.4)+.4*Math.sin(x*.13+z*.11+2)+.22*Math.sin(x*.27-z*.23+.7)+.1*Math.sin(x*.61+z*.53)+.12*Math.sin(x*1.7+.5)*Math.sin(z*2.1);
const terrJS=(x,z)=>{const d=shoreJS(x)-z;return (d>0?-(1-Math.exp(-d*.25))*3:0)+bumpJS(x,z)*(1-ss(-7,-1.5,d))*1.3;};
function waveH(x,z,t){const d=shoreJS(x)-z,dp=Math.max(d>0?(1-Math.exp(-d*.25))*3-.03:0,0);
const shoal=(1+.6*(1-ss(.3,2.5,dp)))*ss(0,.35,dp);let h=0;
for(let i=0;i<(MOB?5:8);i++){const L=14*Math.pow(.6,i),k=6.2832/L,a=.5+Math.sin(i*2.3+1)*.9;
const om=Math.sqrt(9.8*k*Math.tanh(k*Math.max(dp,.15)))*.8;
h+=L*.011*shoal*Math.exp(Math.sin((Math.cos(a)*x+Math.sin(a)*z)*k+t*om+i*1.7)-1);}
return h;}
const renderer=new T.WebGLRenderer({antialias:!MOB,powerPreference:"high-performance"});
let PRbase=MOB?Math.min(devicePixelRatio,1.1):Math.min(devicePixelRatio,1.5);renderer.setPixelRatio(PRbase);
renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(70,innerWidth/innerHeight,.1,4000);
const sunDir=new T.Vector3(.25,.3,-.92).normalize();
const PL=new Float32Array(N*N),pbytes=new Uint8Array(N*N*4),ptex=new T.DataTexture(pbytes,N,N,T.RGBAFormat);
ptex.minFilter=ptex.magFilter=T.LinearFilter;ptex.needsUpdate=true;
const U={time:{value:0},sunDir:{value:sunDir},uw:{value:0},lite:{value:QUEST?1:0},pmap:{value:ptex}};

const COMMON=`#define OCT ${MOB?3:4}
#define WAVES ${MOB?5:8}
#define WMUL ${MOB?"1.5":"1.0"}
uniform vec3 sunDir;uniform float time;uniform float uw;uniform float lite;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<OCT;i++){s+=a*vn(p);p=p*2.03+7.1;a*=.5;}return s;}
float shoreZ(float x){return -10.+3.5*sin(x*.09+1.)+1.5*sin(x*.23);}
float cs(vec2 p){p=p*.02+vec2(time*.5,time*.2);return smoothstep(.45,.75,vn(p)*.65+vn(p*2.3+4.)*.35)*.55;}
vec3 skyCol(vec3 d){float h=max(d.y,0.);
vec3 c=mix(vec3(.74,.86,.97),vec3(.14,.38,.82),pow(h,.45));
float s=max(dot(d,sunDir),0.);
c+=vec3(1.,.78,.5)*pow(s,6.)*.55+vec3(1.,.92,.75)*pow(s,48.)*.9;return c;}
vec3 skyFull(vec3 d){
vec3 c=skyCol(d);float s=dot(d,sunDir);
c+=smoothstep(.99965,.9999,s)*vec3(6.);
float ang=atan(d.x,-d.z);
float rd=(.004+.05*vn(vec2(ang*5.,2.))+.02*vn(vec2(ang*17.,7.)))*smoothstep(-.3,.7,sin(ang+2.4));
if(d.y<rd&&d.y>-.2)c=mix(vec3(.40,.53,.70),skyCol(normalize(vec3(d.x,.02,d.z))),.45);
if(lite>.5){float k2=0.;if(d.y>0.){vec2 p=d.xz/(d.y*.9+.1)*.38+vec2(time*.012,time*.005);float n=fbm(p*1.3);float cover=.5+.1*sin(time*.03);k2=smoothstep(cover,cover+.25,n)*smoothstep(0.,.12,d.y);}return mix(c,vec3(.97,.98,1.),k2*.9);}
if(d.y>0.){
vec2 p=d.xz/(d.y*.9+.1)*.38+vec2(time*.012,time*.005);
vec2 w=vec2(fbm(p*.7+time*.02),fbm(p*.7-time*.017+9.))*.9;
float n=fbm(p*1.3+w),ns=fbm((p+sunDir.xz*.06)*1.3+w);
float cover=.5+.1*sin(time*.03)+.05*sin(time*.071);
float cl=smoothstep(cover,cover+.25,n)*smoothstep(0.,.12,d.y);
float lit=clamp(1.-(ns-n)*4.,0.,1.);
vec3 cc=mix(vec3(.66,.72,.82),vec3(1.),lit);
cc+=vec3(1.,.9,.7)*pow(max(s,0.),5.)*(1.-cl)*.6;
c=mix(c,cc,cl*.96);}
return c;}
float bump(vec2 p){return .55*sin(p.x*.07+1.3)*sin(p.y*.06+.4)+.4*sin(p.x*.13+p.y*.11+2.)+.22*sin(p.x*.27-p.y*.23+.7)+.1*sin(p.x*.61+p.y*.53)+.12*sin(p.x*1.7+.5)*sin(p.y*2.1);}
float terr(vec2 p){float d=shoreZ(p.x)-p.y;float b=d>0.?-(1.-exp(-d*.25))*3.:0.;return b+bump(p)*(1.-smoothstep(-7.,-1.5,d))*1.3;}
vec3 applyFog(vec3 col,vec3 wp){vec3 v=wp-cameraPosition;float d=length(v);
if(uw>.5){float cd=max(-.03-cameraPosition.y,0.);vec3 Tr=exp(-vec3(.32,.07,.04)*d);vec3 sc=vec3(.02,.30,.34)*(.35+.65*sunDir.y)*exp(-cd*.12);return col*Tr+sc*(1.-exp(-d*.16));}
vec3 dir=normalize(vec3(v.x,.03,v.z));
return mix(col,skyCol(dir),1.-exp(-d*d*.00018));}
`;

// ---------- sky ----------
const sky=new T.Mesh(new T.SphereGeometry(500,32,16),new T.ShaderMaterial({
side:T.BackSide,depthWrite:false,uniforms:U,
vertexShader:`varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:COMMON+`varying vec3 vD;void main(){gl_FragColor=vec4(skyFull(normalize(vD)),1.);}`}));
sky.renderOrder=-1;scene.add(sky);

// ---------- ground with shore ----------
const ground=new T.Mesh(new T.PlaneGeometry(300,300,MOB?150:300,MOB?150:300),new T.ShaderMaterial({uniforms:U,
vertexShader:COMMON+`varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);
w.y=terr(w.xz);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
fragmentShader:COMMON+`uniform sampler2D pmap;varying vec3 vW;void main(){
float d=shoreZ(vW.x)-vW.z;
float n=fbm(vW.xz*.3),n2=fbm(vW.xz*.9);
vec3 c=mix(vec3(.10,.17,.05),vec3(.2,.28,.08),n);
c=mix(c,mix(vec3(.12,.10,.05),vec3(.22,.17,.08),n2),smoothstep(.5,.75,fbm(vW.xz*.11)));
c=mix(c,mix(vec3(.66,.58,.40),vec3(.56,.48,.33),n2),smoothstep(-6.,-.5,d));
c*=1.-.45*smoothstep(-1.2,.15,d);
float depth=max((1.-exp(-max(d,0.)*.25))*3.-.03,0.);
if(d>0.){vec2 q=vW.xz*1.4;float a=vn(q+vec2(time*.3,time*.2)),b=vn(q*1.3-vec2(time*.25,-time*.3)+5.);
c+=vec3(.6,.85,.75)*pow(clamp(1.-abs(a-b)*2.5,0.,1.),6.)*(.4+.7*uw)*exp(-depth*.9);}
vec2 e2=vec2(.5,0.);float h0=terr(vW.xz);vec3 tn=normalize(vec3(h0-terr(vW.xz+e2),.5,h0-terr(vW.xz+e2.yx)));c*=clamp(.5+.9*dot(tn,sunDir),.25,1.25);c=mix(c,vec3(.17,.12,.06),texture2D(pmap,vW.xz/90.+.5).r*.85);c*=1.-cs(vW.xz);
gl_FragColor=vec4(applyFog(c,vW),1.);}`}));
ground.rotation.x=-Math.PI/2;scene.add(ground);

// ---------- water simulation (wave equation) ----------
let H=new Float32Array(N*SH),HP=new Float32Array(N*SH);
const C=new Float32Array(N*SH),D=new Float32Array(N*SH),simData=new Float32Array(N*SH*4);
for(let z=0;z<SH;z++)for(let x=0;x<N;x++){
const wx=(x+.5)*CELL-F/2,wz=(z+.5)*CELL-F/2,d=shoreJS(wx)-wz;
const dep=d>0?(1-Math.exp(-d*.25))*3-.03:0;
C[z*N+x]=dep>.05?.06+.28*Math.min(1,dep/2):0;D[z*N+x]=dep>.05?.9965-.05*(1-ss(.05,1.2,dep)):0;}
const simTex=new T.DataTexture(simData,N,SH,T.RGBAFormat,T.FloatType);
simTex.minFilter=simTex.magFilter=T.NearestFilter;simTex.needsUpdate=true;
function simStep(){
for(let z=1;z<SH-1;z++){const r=z*N;for(let x=1;x<N-1;x++){const i=r+x,c=C[i];
if(c===0){HP[i]=0;continue;}
const lap=H[i-1]+H[i+1]+H[i-N]+H[i+N]-4*H[i];
HP[i]=(2*H[i]-HP[i]+c*lap)*D[i];}}
const t=H;H=HP;HP=t;}
function simPack(){
const k=1/(2*CELL);
for(let z=1;z<SH-1;z++)for(let x=1;x<N-1;x++){const i=z*N+x,j=i*4;
simData[j]=(H[i+1]-H[i-1])*k;simData[j+1]=(H[i+N]-H[i-N])*k;simData[j+2]=H[i];}
simTex.needsUpdate=true;}
function splash(x,z,amt,rad){
const cx=(x+F/2)/CELL,cz=(z+F/2)/CELL,rc=Math.ceil(rad/CELL);
for(let zz=Math.floor(cz)-rc;zz<=cz+rc;zz++)for(let xx=Math.floor(cx)-rc;xx<=cx+rc;xx++){
if(xx<1||zz<1||xx>=N-1||zz>=SH-1)continue;const i=zz*N+xx;if(!C[i])continue;
const k=Math.max(0,1-Math.hypot(xx+.5-cx,zz+.5-cz)*CELL/rad);H[i]-=amt*k*k;}}

// ---------- water surface ----------
const wu={...U,sim:{value:simTex},F:{value:F},cell:{value:CELL},ss:{value:new T.Vector2(N,SH)}};
const water=new T.Mesh(new T.PlaneGeometry(6000,6000),new T.ShaderMaterial({uniforms:wu,transparent:true,depthWrite:false,
vertexShader:`varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
fragmentShader:COMMON+`uniform sampler2D sim;uniform vec2 ss;uniform float F,cell;varying vec3 vW;
vec4 simAt(vec2 xz){vec2 p=(xz+F*.5)/cell-.5;vec2 i=floor(p),f=fract(p);
vec4 a=texture2D(sim,(i+.5)/ss),b=texture2D(sim,(i+vec2(1.5,.5))/ss),c=texture2D(sim,(i+vec2(.5,1.5))/ss),d=texture2D(sim,(i+1.5)/ss);
return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
void main(){
vec3 V=cameraPosition-vW;float dist=length(V);V/=dist;
float d=shoreZ(vW.x)-vW.z;
float depth=max((1.-exp(-max(d,0.)*.25))*3.-.03,0.);
vec2 g=vec2(0.);float hgt=0.;
float shoal=(1.+.6*(1.-smoothstep(.3,2.5,depth)))*smoothstep(0.,.35,depth);
for(int i=0;i<WAVES;i++){float fi=float(i);float L=14.*pow(.6,fi);float k=6.2832/L;
float a=.5+sin(fi*2.3+1.)*.9;vec2 dr=vec2(cos(a),sin(a));
float ph=dot(dr,vW.xz)*k+time*sqrt(9.8*k*tanh(k*max(depth,.15)))*.8+fi*1.7;
float amp=L*.011*shoal*clamp(L*30./(dist+1.),0.,1.);
float e=exp(sin(ph)-1.);hgt+=amp*e;g+=dr*amp*k*e*cos(ph);}

vec2 q=vW.xz*2.5+vec2(time*.5,time*.3);float c0=vn(q);
vec2 dn=vec2(vn(q+vec2(.05,0.))-c0,vn(q+vec2(0.,.05))-c0)*20.;
q=vW.xz*7.+vec2(-time*.7,time*.5);c0=vn(q);
dn+=vec2(vn(q+vec2(.05,0.))-c0,vn(q+vec2(0.,.05))-c0)*10.;
g+=dn*.06*clamp(60./(dist+1.),0.,1.);
float m=step(-F*.5+.4,vW.x)*step(vW.x,F*.5-.4)*step(-F*.5+.4,vW.z)*step(vW.z,-F*.5+ss.y*cell-.4);
vec4 s=simAt(vW.xz)*m;g+=s.xy*6.;hgt+=s.z;
vec3 n=normalize(vec3(-g.x,1.,-g.y));
if(uw>.5){vec3 I=-V;vec3 rf=refract(I,-n,1.33);
vec3 uc=vec3(0.,.2,.3)*(.6+.6*sunDir.y);
float win=smoothstep(.62,.72,dot(I,n));
vec3 oc=mix(uc*1.4,skyFull(normalize(rf+vec3(0.,1e-4,0.)))*vec3(.75,.92,.95),win);
oc=mix(oc,uc,1.-exp(-dist*.04));
oc*=.85+.3*vn(vW.xz*.7+time*.35);gl_FragColor=vec4(oc,smoothstep(0.,.03,depth));return;}
float fres=.02+.98*pow(1.-max(dot(n,V),0.),5.);
vec3 R=reflect(-V,n);R.y=abs(R.y);R=normalize(R);
vec3 refl=skyFull(R);
float dc=1.-exp(-depth*.9);
float sss=clamp(hgt*3.+.5,0.,1.);
vec3 body=mix(vec3(.12,.5,.5),vec3(0.,.09,.2),dc);
body=mix(body,vec3(0.,.42,.52),sss*.45*dc);
body*=.55+.5*clamp(dot(n,sunDir)*.5+.5,0.,1.);
float sr=max(dot(R,sunDir),0.);
vec3 spark=vec3(1.,.9,.7)*(pow(sr,400.)*18.+pow(sr,40.)*.35)*(.3+.7*fres);
vec3 col=body*(1.-fres)+refl*fres+spark;
float nz=fbm(vW.xz*3.+time*.1);
float foam=smoothstep(.45,0.,depth)*smoothstep(.35,.7,nz+.25*sin(depth*30.-time*2.5+nz*6.));
foam=clamp(foam+smoothstep(.03,.09,abs(s.z))*.5*nz+smoothstep(.28,.5,length(g))*(1.-smoothstep(0.,1.6,depth))*smoothstep(.3,.7,nz)*.8+smoothstep(.55,.9,length(g))*.5*nz,0.,1.);
col=mix(col,vec3(.95,.97,1.)*(.65+.35*sunDir.y),foam*.85);
float al=max(clamp(max(fres,1.-exp(-depth*2.2)),0.,1.),foam)*smoothstep(0.,.03,depth);
col=mix(col,skyCol(normalize(vec3(-V.x,.02,-V.z))),1.-exp(-dist*dist*.0000025));
gl_FragColor=vec4(col,al);}`}));
water.rotation.x=-Math.PI/2;water.position.set(0,-.03,0);scene.add(water);

// ---------- trample map ----------
const R=new Float32Array(N*N),A=new Float32Array(N*N),DX=new Float32Array(N*N),DZ=new Float32Array(N*N);
const bytes=new Uint8Array(N*N*4);
const tex=new T.DataTexture(bytes,N,N,T.RGBAFormat);
tex.minFilter=tex.magFilter=T.LinearFilter;tex.needsUpdate=true;

// ---------- grass ----------
const levels=MOB?3:4,verts=[],idx=[];
for(let i=0;i<levels;i++){const t=i/levels,w=.5*(1-t*.8);verts.push(-w,t,0,w,t,0);}
verts.push(0,1,0);
for(let i=0;i<levels-1;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
{const a=(levels-1)*2;idx.push(a,a+1,levels*2);}
const g=new T.InstancedBufferGeometry();
g.setAttribute('position',new T.Float32BufferAttribute(verts,3));g.setIndex(idx);
const COUNT=MOB?90000:260000,off=new Float32Array(COUNT*3),rnd=new Float32Array(COUNT*3);
for(let n=0;n<COUNT;){const x=(Math.random()-.5)*F,z=(Math.random()-.5)*F,ds=z-shoreJS(x);
if(ds<1||(ds<8&&Math.random()>(ds-1)/7))continue;
off[n*3]=x;off[n*3+1]=z;rnd[n*3]=Math.random();rnd[n*3+1]=Math.random();rnd[n*3+2]=Math.random();n++;}
g.setAttribute('off',new T.InstancedBufferAttribute(off,3));
g.setAttribute('rnd',new T.InstancedBufferAttribute(rnd,3));
g.instanceCount=COUNT;
const gu={...U,map:{value:tex},player:{value:new T.Vector3()},F:{value:F},hd0:{value:new T.Vector4()},hd1:{value:new T.Vector4()},gc0:{value:new T.Vector4()},gc1:{value:new T.Vector4()},gh0:{value:new T.Vector3()},gh1:{value:new T.Vector3()}};
const grass=new T.Mesh(g,new T.ShaderMaterial({uniforms:gu,side:T.DoubleSide,
vertexShader:COMMON+`attribute vec3 off;attribute vec3 rnd;uniform sampler2D map;uniform vec3 player;uniform float F;uniform sampler2D pmap;uniform vec4 hd0,hd1,gc0,gc1;uniform vec3 gh0,gh1;
varying float vT;varying float vR;varying float vTr;varying float vCl;varying float vX;varying float vP;varying float vTL;
varying vec3 vW;varying vec3 vN;
vec3 bp(float t,float sx,float wid,float yaw,float tw,float height,vec2 tb,float fl){
float ya=yaw+t*tw;
vec3 p=vec3(sx*wid*cos(ya),0.,-sx*wid*sin(ya));
float len=t*height;vec2 b=tb*t*t;float hb=length(b);
p.y=sqrt(max(len*len-.8*hb*hb,.12*len*len))*(1.-.6*fl*t);
p.xz+=b;return p;}
void main(){
float t=position.y;
vec4 tr=texture2D(map,off.xy/F+.5);
float amt=tr.r;vec2 pd=tr.gb*2.-1.;
vec2 dp=off.xy-player.xz;float dist=length(dp);
float live=smoothstep(1.3,.1,dist);
float pat=vn(off.xy*.04)*.65+vn(off.xy*.13+3.)*.35;
float height=(.4+rnd.x*.7)*(.65+.8*pat);
height*=mix(1.,.18,tr.a*step(.35,rnd.y));
float pr=texture2D(pmap,off.xy/F+.5).r;
height*=clamp((rnd.z-pr*1.4)*4.+1.,0.,1.);
float yaw=rnd.z*6.2832,tw=(rnd.y-.5)*1.6;
float wid=(.09+rnd.y*.06)*(.8+.4*pat)*WMUL;
float wnd=sin(time*1.3+off.x*.13+off.y*.09)*.4+sin(time*2.7+off.x*.5+off.y*.4)*.2+(vn(off.xy*.07+vec2(time*.7,time*.25))-.5)*2.4+.3;
float fl=max(amt*.9,live);
vec2 pdir=mix(normalize(dp+vec2(.001)),pd,smoothstep(.2,.8,amt)*step(.01,amt));
vec2 tb=normalize(vec2(1.,.4))*(wnd*.3+sin(time*6.+rnd.x*30.+off.x)*.03)*height;
tb+=vec2(sin(yaw),cos(yaw))*height*.3*(.3+rnd.x);
tb+=pdir*fl*height*1.1;
vec2 hp0=off.xy-hd0.xz,hp1=off.xy-hd1.xz;
